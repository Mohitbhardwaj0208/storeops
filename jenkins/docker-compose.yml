services:
  jenkins:
    build: .
    image: storeops-jenkins:local
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Let Jenkins use the laptop's Docker engine (docker-outside-of-docker)
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:

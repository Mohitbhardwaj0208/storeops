services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storeops
      POSTGRES_PASSWORD: storeops
      POSTGRES_DB: storeops
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storeops"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: storeops-api:local
    environment:
      DATABASE_URL: postgresql://storeops:storeops@db:5432/storeops
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
